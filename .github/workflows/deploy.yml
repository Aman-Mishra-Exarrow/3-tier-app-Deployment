name: Build & Deploy Frontend + Backend to EKS

on:
   workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  CLUSTER_NAME: Three-tier-cloud
  FRONTEND_ECR: three-tier-frontend
  BACKEND_ECR: three-tier-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- AWS AUTH ----------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/AWSRoleForGithubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ---------- ECR LOGIN ----------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ---------- BUILD FRONTEND ----------
      - name: Build & Push Frontend Image
        run: |
          FRONTEND_IMAGE=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${FRONTEND_ECR}:${GITHUB_SHA}
          docker build -t $FRONTEND_IMAGE ./frontend
          docker push $FRONTEND_IMAGE
          echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> $GITHUB_ENV

      # ---------- BUILD BACKEND ----------
      - name: Build & Push Backend Image
        run: |
          BACKEND_IMAGE=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_ECR}:${GITHUB_SHA}
          docker build -t $BACKEND_IMAGE ./backend
          docker push $BACKEND_IMAGE
          echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> $GITHUB_ENV

      # ---------- KUBECTL ----------
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME

      - name: Verify EKS access
        run: |
          kubectl get ns
          kubectl auth can-i get nodes

      - name: Ensure namespace exists
        run: |
          kubectl get ns workshop || kubectl create ns workshop

      # ---------- DEPLOY ----------
      - name: Deploy to EKS
        run: |
          sed -i "s|__FRONTEND_IMAGE__|$FRONTEND_IMAGE|g" k8s_manifests/frontend-deployment.yaml
          sed -i "s|__BACKEND_IMAGE__|$BACKEND_IMAGE|g" k8s_manifests/backend-deployment.yaml

          kubectl apply -R -f k8s_manifests/
