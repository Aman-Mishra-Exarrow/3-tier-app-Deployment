name: Node scaling test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    if: vars.INFRA_ALREADY_CREATED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/AWSRoleForGithubActions
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: terra-config
        run: terraform init

      - name: Terraform Validate
        working-directory: terra-config
        run: terraform validate

      - name: Terraform Plan
        working-directory: terra-config
        run: terraform plan

      - name: Terraform Apply
        working-directory: terra-config
        run: terraform apply -auto-approve

  scale-nodegroup:
    if: vars.INFRA_ALREADY_CREATED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/AWSRoleForGithubActions
          aws-region: us-east-1

      - name: Install eksctl
        run: |
          curl --silent --location \
            "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz" \
            | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

      - name: Validate scaling values
        run: |
          MIN=${{ vars.NODEGROUP_MIN_SIZE }}
          MAX=${{ vars.NODEGROUP_MAX_SIZE }}
          DESIRED=${{ vars.NODEGROUP_DESIRED_SIZE }}

          echo "Min=$MIN | Max=$MAX | Desired=$DESIRED"

          if [ "$MIN" -gt "$MAX" ]; then
            echo "ERROR: MIN ($MIN) cannot be greater than MAX ($MAX)"
            exit 1
          fi

      - name: Scale nodegroup via eksctl
        run: |
          eksctl scale nodegroup \
            --cluster=${{ vars.CLUSTER_NAME }} \
            --name=${{ vars.NODEGROUP_NAME }} \
            --nodes-min=${{ vars.NODEGROUP_MIN_SIZE }} \
            --nodes-max=${{ vars.NODEGROUP_MAX_SIZE }} \
            --nodes=${{ vars.NODEGROUP_DESIRED_SIZE }} \
            --region=us-east-1