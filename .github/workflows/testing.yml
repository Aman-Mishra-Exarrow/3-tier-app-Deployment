name: Node & pod scaling test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  scale-nodegroup:
    if: vars.SCALE_INFRA == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/AWSRoleForGithubActions
          aws-region: us-east-1

      - name: Install eksctl
        run: |
          curl --silent --location \
            "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz" \
            | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

      - name: Scale nodegroup via eksctl
        run: |
          eksctl scale nodegroup \
            --cluster=${{ vars.CLUSTER_NAME }} \
            --name=${{ vars.NODEGROUP_NAME }} \
            --nodes-min=${{ vars.NODEGROUP_MIN_SIZE }} \
            --nodes-max=${{ vars.NODEGROUP_MAX_SIZE }} \
            --nodes=${{ vars.NODEGROUP_DESIRED_SIZE }} \
            --region=us-east-1

  scale-pods:
    if: vars.SCALE_INFRA == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/AWSRoleForGithubActions
          aws-region: us-east-1

      - name: Install kubectl
        run: |
          curl -LO "https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Set up KUBECONFIG for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ vars.CLUSTER_NAME }} \
            --region us-east-1

      - name: Scale pod replicas
        run: |
          kubectl scale deployment --all  \
            --replicas=${{ vars.POD_DESIRED_REPLICAS }} \
            --namespace=${{ vars.NAMESPACE }}

      - name: Verify
        run: |
          echo "=== Deployment ==="
          kubectl get deployment ${{ vars.DEPLOYMENT_NAME }} -n ${{ vars.NAMESPACE }}